[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200

; --- --- This line forces PlatformIO to search deeper for base libraries! ---
lib_ldf_mode = deep

lib_deps =
    ; --- Force loading of base libraries ---
    SPI
    Wire

    ; --- The new graphic library ---
    lovyan03/LovyanGFX@1.1.12
    
    ; --- Graphic Library for interface ---
    lvgl/lvgl @ ^8.3.9
    
    ; --- Sensor SHT31 ---
    adafruit/Adafruit SHT31 Library @ ^2.2.0
    
    ; --- Home Automation and Network (MQTT) ---
    knolleary/PubSubClient @ ^2.8
    
    ; --- Temperature Control (PID) ---
    br3ttb/PID @ ^1.2.1

    ; --- WEB PORTAL LIBRARY ---
    tzapu/WiFiManager @ ^2.0.16-rc.2

    ; --- ebserver library ---
    bblanchon/ArduinoJson

    ; --- mqtt lib ---
    knolleary/PubSubClient

build_flags =
    -D LV_CONF_SKIP             ; Ignore the file lv_conf.h
    -D LV_COLOR_DEPTH=16        ; 16-bit color (the standard for SPI LCD panel)
    -D LV_FONT_MONTSERRAT_24=1  ; Turn on 24 font
    -D LV_FONT_MONTSERRAT_28=1  ; Turn on 28 font